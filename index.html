        // 全螢幕：優先使用瀏覽器的全螢幕功能；iPhone Safari 等不支援（或被擋住）時，
        // 改用「模擬全螢幕」：隱藏控制介面、讓畫面佔滿整個可用區域，行為和真正的全螢幕一致。
        let pseudoFs = false;

        function isFs() { return !!document.fullscreenElement || pseudoFs; }

        function applyFsUI(active) {
            const btn = document.getElementById('fsToggleBtn');
            const closeFsBtn = document.getElementById('closeFsBtn');
            const closeFsKeepBtn = document.getElementById('closeFsKeepBtn');
            document.documentElement.classList.toggle('pseudo-fs', pseudoFs && active);

            if (active) {
                document.body.classList.add('fullscreen-active');
                if (btn) btn.innerText = "退出並清除";
                [closeFsBtn, closeFsKeepBtn].forEach(el => {
                    if (el) { el.classList.remove('hidden'); el.classList.add('flex'); }
                });
            } else {
                document.body.classList.remove('fullscreen-active');
                if (btn) btn.innerText = "全螢幕";
                [closeFsBtn, closeFsKeepBtn].forEach(el => {
                    if (el) { el.classList.add('hidden'); el.classList.remove('flex'); }
                });
                if (!keepMediaOnExit) { clearAllChannels(); }
                keepMediaOnExit = false;
            }
        }

        function startPseudoFs() {
            pseudoFs = true;
            applyFsUI(true);
        }

        function enterFs() {
            const el = document.documentElement;
            const req = el.requestFullscreen || el.webkitRequestFullscreen;
            if (!req) { startPseudoFs(); return; }
            try {
                const r = req.call(el);
                if (r && typeof r.catch === 'function') r.catch(() => startPseudoFs());
            } catch (_) {
                startPseudoFs();
            }
        }

        function leaveFs() {
            if (document.fullscreenElement && document.exitFullscreen) {
                document.exitFullscreen();
            } else if (pseudoFs) {
                pseudoFs = false;
                applyFsUI(false);
            }
        }

        function toggleFullscreen() {
            if (isFs()) {
                keepMediaOnExit = false;
                leaveFs();
            } else {
                enterFs();
            }
        }

        function exitFullscreenKeep() {
            if (isFs()) {
                keepMediaOnExit = true;
                leaveFs();
            }
        }

        document.addEventListener('fullscreenchange', () => {
            applyFsUI(!!document.fullscreenElement);
        });

        // R 鍵／重播按鈕：將目前每一格正在播放的影片從頭再播放一次，播放清單與分配不變
        function replayCurrentVideos() {
            channels.forEach((ch, idx) => {
                if (idx >= visibleChannelCount || !ch || !ch.media || ch.media.length === 0) return;
                const item = ch.media[ch.cursor];
                if (!item || item.type !== 'video') return;

                clearTimeout(ch.timer);
                ch.isSuspended = false;
                ch.savedTime = 0;
                try {
                    ch.video.currentTime = 0;
                    ch.video.playbackRate = parseFloat(ch.speedRange.value);
                    ch.video.muted = ch.isMuted;
                    const playPromise = ch.video.play();
                    if (playPromise && typeof playPromise.catch === 'function') playPromise.catch(() => {});
                } catch (err) {
                    renderMedia(idx, 0);
                }
            });
        }

        function showMessage(text) {
            document.getElementById('messageText').innerText = text;
            document.getElementById('messageBox').style.display = 'block';
        }

        function closeMessage() { document.getElementById('messageBox').style.display = 'none'; }

        // 音量 + 鍵：播放下一輪影片（所有格子各自換下一部，等同 S 鍵）
        const isVolumeUpKey = (e) => e.key === 'AudioVolumeUp' || e.key === 'VolumeUp' || e.code === 'AudioVolumeUp' || e.keyCode === 175 || e.keyCode === 183 || e.keyCode === 24;
        let lastVolumeNext = 0;
        function volumeUpNext() {
            const now = Date.now();
            if (now - lastVolumeNext < 300) return;   // 防止長按連續觸發太快
            lastVolumeNext = now;
            nextAll();
            if (typeof showToast === 'function') showToast('下一輪影片');
        }

        // 藍牙遙控器／耳機的「下一首」鍵也當成下一輪
        if ('mediaSession' in navigator) {
            try { navigator.mediaSession.setActionHandler('nexttrack', volumeUpNext); } catch (err) {}
        }

        window.addEventListener('keydown', (e) => { 
            if (isVolumeUpKey(e)) {
                e.preventDefault();
                volumeUpNext();
                return;
            }
            if (e.code === 'Space') { 
                e.preventDefault(); 
                controlAll('toggle'); 
            } else if (e.key === 'a' || e.key === 'A') {
                e.preventDefault();
                prevAll();
            } else if (e.key === 's' || e.key === 'S') {
                e.preventDefault();
                nextAll();
            } else if (e.key === 'q' || e.key === 'Q') {
                e.preventDefault();
                skipAll(-5);
            } else if (e.key === 'w' || e.key === 'W') {
                e.preventDefault();
                skipAll(5);
            } else if (e.key === 'o' || e.key === 'O') {
                e.preventDefault();
                adjustGlobalSpeed(-0.1);
            } else if (e.key === 'p' || e.key === 'P') {
                e.preventDefault();
                adjustGlobalSpeed(0.1);
            } else if (e.key === 'd' || e.key === 'D') {
                e.preventDefault();
                triggerShuffleMaster();
            } else if (e.key === 'k' || e.key === 'K') {
                e.preventDefault();
                nextFolder();
            } else if (e.key === 'j' || e.key === 'J') {
                e.preventDefault();
                prevFolder();
            } else if (e.key === 'l' || e.key === 'L') {
                e.preventDefault();
                randomFolder();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                toggleAutoFolder();
            } else if (e.key === 'e' || e.key === 'E') {
                e.preventDefault();
                const fileInput = document.getElementById('masterFileInput');
                if (fileInput) fileInput.click();
            } else if (e.key === 'f' || e.key === 'F') {
                e.preventDefault();
                toggleFullscreen();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                replayCurrentVideos();
            } else if (e.key === 'z' || e.key === 'Z') {
                e.preventDefault();
                rotateAll(-90); // 逆時針轉 90 度
            } else if (e.key === 'x' || e.key === 'X') {
                e.preventDefault();
                rotateAll(90);  // 順時針轉 90 度
            } else if (e.key === '8') {
                e.preventDefault();
                adjustGlobalY(-10);
            } else if (e.key === '2') {
                e.preventDefault();
                adjustGlobalY(10);
            } else if (e.key === 'F1') {
                e.preventDefault();
                exitFullscreenKeep();
            } else if (e.key === 'ArrowLeft') {
                if (activeChannelIdx !== null && activeChannelIdx < visibleChannelCount) {
                    e.preventDefault();
                    skipSingleChannel(activeChannelIdx, -5);
                }
            } else if (e.key === 'ArrowRight') {
                if (activeChannelIdx !== null && activeChannelIdx < visibleChannelCount) {
                    e.preventDefault();
                    skipSingleChannel(activeChannelIdx, 5);
                }
            } else if (e.key === '-' || e.code === 'Minus' || e.code === 'NumpadSubtract') {
                e.preventDefault();
                adjustZoom(-0.1);
            } else if (e.key === '+' || e.key === '=' || e.code === 'Equal' || e.code === 'NumpadAdd') {
                e.preventDefault();
                adjustZoom(0.1);
            }
        });

        // 新增右鍵快捷鍵：等同於 D 鍵（隨機打亂所有頻道的媒體播放）
        window.addEventListener('contextmenu', (e) => {
            e.preventDefault(); // 阻止系統右鍵預設選單彈出
            triggerShuffleMaster();
        });

        let hideTimer;
        const resetIdleTimer = () => {
            const ctrl = document.getElementById('masterControls');
            document.body.classList.remove('user-idle');
            ctrl.style.opacity = '1';
            clearTimeout(hideTimer);
            hideTimer = setTimeout(() => {
                document.body.classList.add('user-idle');
                ctrl.style.opacity = '0';
            }, 3000);
        };
        // 滑鼠移動、點擊與觸控時，正常喚醒控制介面與滑鼠游標
        ['mousemove', 'mousedown', 'touchstart'].forEach(e => document.addEventListener(e, resetIdleTimer));

        // 鍵盤操作時通常會喚醒控制介面；但全螢幕模式下按 A、S、D 時維持隱藏游標
        document.addEventListener('keydown', (e) => {
            const isFullscreenAsdKey = isFs() && ['a', 's', 'd'].includes(e.key.toLowerCase());
            if (isFullscreenAsdKey) return;

            // K 鍵（切換資料夾）：不要喚醒控制介面，反而立即隱藏，
            // 之後只有滑鼠移動、點擊或觸控時才會再出現。
            if (['k', 'K', 'j', 'J', 'l', 'L', 'h', 'H'].includes(e.key)) {
                clearTimeout(hideTimer);
                document.body.classList.add('user-idle');
                document.getElementById('masterControls').style.opacity = '0';
                return;
            }
            resetIdleTimer();
        });

        resetIdleTimer();

        // 啟動初始化調控桿與預設 8 頻道佈局
        changeGridCount('5');
    </script>

<script>
    // 註冊 Service Worker（需要 https 或 localhost）；失敗不影響一般使用。
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        });
    }
</script>
</body>
